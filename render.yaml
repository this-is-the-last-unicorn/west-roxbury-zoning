# Render Blueprint — West Roxbury Zoning Analysis
# https://render.com/docs/blueprint-spec

services:
  # =============================================================================
  # Web Frontend (Next.js)
  # =============================================================================
  - type: web
    name: wrz-web
    runtime: node
    region: oregon
    plan: standard
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 70
    rootDir: apps/web
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MAPBOX_TOKEN
        sync: false

  # =============================================================================
  # API (Express)
  # =============================================================================
  - type: web
    name: wrz-api
    runtime: node
    region: oregon
    plan: standard
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 70
    buildCommand: bun install && bun run db:generate:build && bun run build:api
    startCommand: bun run db:migrate:deploy:runtime && bun run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wrz-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false

# =============================================================================
# Databases
# =============================================================================
databases:
  - name: wrz-db
    databaseName: west_roxbury_zoning
    user: wrz_user
    plan: basic-1gb
    region: oregon
    postgresMajorVersion: "16"
